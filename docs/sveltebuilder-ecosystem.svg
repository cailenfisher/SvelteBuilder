    <text class="s m" x="320" y="100" text-anchor="middle">npm create sveltebuilder@latest</text>
    <text class="x" x="320" y="118" text-anchor="middle">prompts: template · modules · screen bundles</text>
  </g>
  <g class="amber">
    <rect class="box" x="500" y="56" width="280" height="74" rx="10" stroke-width="1"/>
    <text class="t m" x="640" y="80" text-anchor="middle">@sveltebuilder/cli</text>
    <text class="s m" x="640" y="100" text-anchor="middle">sveltebuilder sync:supabase</text>
    <text class="x" x="640" y="118" text-anchor="middle">sveltebuilder add &lt;module&gt; — planned</text>
  </g>
  <line class="arr" x1="460" y1="93" x2="497" y2="93" marker-end="url(#ah)"/>
  <text class="muted x" x="479" y="86" text-anchor="middle">uses</text>

