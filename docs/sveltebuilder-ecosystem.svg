    <text class="x" x="268" y="342" text-anchor="middle">Supabase Auth (Google OAuth) · user_account · navigation_item</text>
  </g>
  <g class="teal planned">
    <rect class="box" x="488" y="284" width="408" height="68" rx="8" stroke-width="1"/>
    <rect class="pill" x="812" y="293" width="74" height="18" rx="9"/>
    <text class="pilltext" x="849" y="306" text-anchor="middle">on hold</text>
    <text class="t" x="692" y="306" text-anchor="middle">Native</text>
    <text class="s" x="692" y="325" text-anchor="middle">provider-agnostic Postgres data layer</text>
    <text class="x" x="692" y="342" text-anchor="middle">Auth.js (@auth/sveltekit) · provider of your choice</text>
  </g>

  <g class="gray">
    <rect class="box" x="64" y="364" width="266" height="58" rx="8" stroke-width="1"/>
    <text class="t" x="197" y="387" text-anchor="middle">screen bundles</text>
    <text class="x" x="197" y="406" text-anchor="middle">list · detail · shared layout, copied into routes</text>
  </g>
  <g class="gray">
    <rect class="box" x="347" y="364" width="266" height="58" rx="8" stroke-width="1"/>
    <text class="t" x="480" y="387" text-anchor="middle">data access + locale resolution</text>
    <text class="x" x="480" y="406" text-anchor="middle">loaders and queries live in the scaffold</text>
  </g>
  <g class="gray">
    <rect class="box" x="630" y="364" width="266" height="58" rx="8" stroke-width="1"/>
    <text class="t m" x="763" y="387" text-anchor="middle">supabase/</text>
    <text class="x" x="763" y="406" text-anchor="middle">migration · RLS · functions · seed.sql</text>
  </g>

