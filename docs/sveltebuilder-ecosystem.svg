<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">SvelteBuilder ecosystem</title>
  <desc id="sb-desc">Layered diagram. create-sveltebuilder, which uses @sveltebuilder/cli, scaffolds your SvelteKit project: a shared base template, the SuperPrototype template (available) or Native (on hold), copied screen bundles, scaffold-owned data access, and generated Supabase SQL. The project depends on domain modules: content and logistic (available), commerce (not started), analytics, advertisement and media (planned). Modules are built on the foundation: diglossia, @sveltebuilder/coreui and @sveltebuilder/local-text-schema. Schema is applied in three tiers: local-text, template, module, then sync:supabase generates the migration.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; }
    .x { font-size: 11px; }
    .h { font-size: 13px; font-weight: 600; }
    .bg { fill: #FFFFFF; }
    .heading { fill: #2C2C2A; }
    .muted { fill: #5F5E5A; }
    .frame { fill: #F7F7F5; stroke: #B4B2A9; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .arrhead { fill: #888780; }
    .amber .box { fill: #FAEEDA; stroke: #BA7517; } .amber .t { fill: #633806; } .amber .s, .amber .x { fill: #854F0B; }
    .teal .box { fill: #E1F5EE; stroke: #1D9E75; } .teal .t { fill: #085041; } .teal .s, .teal .x { fill: #0F6E56; }
    .blue .box { fill: #E6F1FB; stroke: #378ADD; } .blue .t { fill: #0C447C; } .blue .s, .blue .x { fill: #185FA5; }
    .coral .box { fill: #FAECE7; stroke: #D85A30; } .coral .t { fill: #712B13; } .coral .s, .coral .x { fill: #993C1D; }
    .purple .box { fill: #EEEDFE; stroke: #7F77DD; } .purple .t { fill: #3C3489; } .purple .s, .purple .x { fill: #534AB7; }
    .gray .box { fill: #FFFFFF; stroke: #B4B2A9; } .gray .t { fill: #2C2C2A; } .gray .s, .gray .x { fill: #5F5E5A; }
    .planned .box { stroke-dasharray: 5 4; }
    .planned text { opacity: 0.72; }
    .pill { stroke: none; }
    .teal .pill { fill: #1D9E75; } .gray .pill, .planned .pill { fill: #888780; }
    .pilltext { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1A1A19; }
      .heading { fill: #F1EFE8; }
      .muted { fill: #B4B2A9; }
      .frame { fill: #232321; stroke: #5F5E5A; }
      .amber .box { fill: #412402; } .amber .t { fill: #FAC775; } .amber .s, .amber .x { fill: #EF9F27; }
      .teal .box { fill: #04342C; } .teal .t { fill: #9FE1CB; } .teal .s, .teal .x { fill: #5DCAA5; }
      .blue .box { fill: #042C53; } .blue .t { fill: #B5D4F4; } .blue .s, .blue .x { fill: #85B7EB; }
      .coral .box { fill: #4A1B0C; } .coral .t { fill: #F5C4B3; } .coral .s, .coral .x { fill: #F0997B; }
      .purple .box { fill: #26215C; } .purple .t { fill: #CECBF6; } .purple .s, .purple .x { fill: #AFA9EC; }
      .gray .box { fill: #2C2C2A; stroke: #5F5E5A; } .gray .t { fill: #F1EFE8; } .gray .s, .gray .x { fill: #B4B2A9; }
      .teal .pill { fill: #0F6E56; } .gray .pill, .planned .pill { fill: #5F5E5A; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" class="arrhead"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="900" rx="16"/>
  <text class="heading" x="40" y="36" style="font-size:18px;font-weight:700">SvelteBuilder ecosystem</text>
  <text class="muted s" x="920" y="36" text-anchor="end">scaffold once · own the code · build on shared modules</text>

