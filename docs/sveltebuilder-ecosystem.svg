  <!-- ===== Foundation ===== -->
  <rect class="frame" x="40" y="660" width="880" height="132" rx="12" stroke-width="1"/>
  <text class="heading h" x="60" y="683">foundation</text>
  <text class="muted x" x="900" y="683" text-anchor="end">single source of the i18n primitives and the universal UI set</text>

  <g class="coral">
