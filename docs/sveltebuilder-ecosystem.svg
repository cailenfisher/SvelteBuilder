    <text class="x m" x="832" y="535" text-anchor="middle">@sveltebuilder/</text>
    <text class="t" x="832" y="554" text-anchor="middle">media</text>
    <text class="x" x="832" y="591" text-anchor="middle" font-weight="600">planned</text>
  </g>

  <!-- built on arrow -->
