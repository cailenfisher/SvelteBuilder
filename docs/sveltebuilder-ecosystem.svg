  <rect class="frame" x="40" y="170" width="880" height="268" rx="12" stroke-width="1"/>
  <text class="heading h" x="60" y="193">your SvelteKit project</text>
  <text class="muted x" x="900" y="193" text-anchor="end">copied in once — yours from then on</text>

  <g class="teal">
    <rect class="box" x="64" y="206" width="832" height="66" rx="8" stroke-width="1"/>
    <text class="t" x="480" y="227" text-anchor="middle">base template — shared by every scaffold</text>
