    <text class="x" x="480" y="261" text-anchor="middle">admin screens for locales, copy and navigation · coreui cascade layers · seed: 8 locales, en + fr copy</text>
  </g>

  <g class="teal">
    <rect class="box" x="64" y="284" width="408" height="68" rx="8" stroke-width="1"/>
